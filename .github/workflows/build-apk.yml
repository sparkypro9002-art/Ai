name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          HTML_FILE=$(ls *.html 2>/dev/null | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" www/index.html
          elif [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            echo "Error: No HTML file found!" && exit 1
          fi

      - name: Install Dependencies and Initialize Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 @capgo/capacitor-native-biometric@6.0.0
          npx cap init "Private AI" "com.privateai.enterprise" --web-dir "www"
          npx cap add android

      - name: Inject Android Hardware Permissions & Cleartext Config
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          PERMISSIONS='    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.fingerprint" android:required="false" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
          sed -i "/<\/manifest>/i $PERMISSIONS" $MANIFEST_PATH
          sed -i 's/<application /<application android:hardwareAccelerated="true" android:usesCleartextTraffic="true" /' $MANIFEST_PATH

      - name: Sync Capacitor Project
        run: |
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Installer APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Private-AI-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
